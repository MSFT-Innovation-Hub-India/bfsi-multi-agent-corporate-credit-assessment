services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmr-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AZURE_STORAGE_ACCOUNT_NAME=${AZURE_STORAGE_ACCOUNT_NAME:-}
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME:-creditreport}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    restart: unless-stopped
    # Commenting out health check for local testing - uncomment for production
    # healthcheck:
    #   test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 5s
    networks:
      - gmr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gmr-frontend
    ports:
      - "8080:8080"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    # Commenting out health check for local testing - uncomment for production
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 5s
    networks:
      - gmr-network

networks:
  gmr-network:
    driver: bridge
